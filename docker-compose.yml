services:
  web-security-scanner:
    build:
      context: .
      dockerfile: Dockerfile
    image: web-security-scanner:latest
    container_name: web-security-scanner
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - /www/wwwroot:/www/wwwroot:ro
      - /home/uzem/.openclaw/workspace:/home/uzem/.openclaw/workspace
      - /home/uzem/.config/gcloud:/home/uzem/.config/gcloud:ro
      # Faz 3: tarama geçmişi (SQLite) kalıcı birimde — konteyner yeniden kurulunca kaybolmaz
      - wss_data:/app/data
    environment:
      - HOST=0.0.0.0
      - PORT=8765
      - NO_BROWSER=1

volumes:
  wss_data:
