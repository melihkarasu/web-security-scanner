services:
  web-security-scanner:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_CHROMIUM: "${INSTALL_CHROMIUM:-1}"
        INSTALL_STRIX: "${INSTALL_STRIX:-1}"
    image: web-security-scanner:latest
    container_name: web-security-scanner
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      # ---------------------------------------------------------------------------
      # YEREL PROJE KLASÖRÜ BAĞLANTISI (/workspace olarak konteyner içine bağlanır)
      # Yöntem A (.env ile): .env dosyasına WSS_PROJECTS_DIR=C:/xampp/htdocs yazın.
      # Yöntem B (Doğrudan YAML ile): Aşağıdaki varsayılan satırı yorum (#) yapıp
      #          işletim sisteminize uygun örnek satırın başındaki # işaretini kaldırın:
      # - C:/xampp/htdocs:/workspace:ro                  # Windows (XAMPP / Wamp / Laragon örneği)
      # - C:/Users/Kullanici/Projects:/workspace:ro      # Windows (Proje klasörü örneği)
      # - /var/www/html:/workspace:ro                    # Linux (Apache / Nginx web kökü örneği)
      # - /Users/kullanici/Sites:/workspace:ro           # macOS (Yerel geliştirme klasörü örneği)
      # ---------------------------------------------------------------------------
      - ${WSS_PROJECTS_DIR:-~}:/workspace:ro
      # Faz 3: tarama geçmişi (SQLite) kalıcı birimde — konteyner yeniden kurulunca kaybolmaz
      - wss_data:/app/data
      # Opsiyonel: gcloud ADC kimlik bilgisi bağlamak isterseniz yorum satırını kaldırın:
      # - ~/.config/gcloud:/home/scanneruser/.config/gcloud:ro
    environment:
      - HOST=0.0.0.0
      - PORT=8765
      - NO_BROWSER=1
      - WSS_BROWSER_NO_SANDBOX=1
      - WSS_EDITION=${WSS_EDITION:-full}
      - WSS_WORKSPACE_ROOT=/workspace

volumes:
  wss_data:
